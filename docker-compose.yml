version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://gatemate:${POSTGRES_PASSWORD:-gatemate_secret}@postgres:5432/${POSTGRES_DB:-gatemate_db}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - QR_SIGNING_SECRET=${QR_SIGNING_SECRET}
      - ENABLE_DEMO_ACCOUNTS=${ENABLE_DEMO_ACCOUNTS:-false}
      - NEXT_PUBLIC_ENABLE_DEMO_ACCOUNTS=${NEXT_PUBLIC_ENABLE_DEMO_ACCOUNTS:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: gatemate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatemate_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gatemate_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatemate -d ${POSTGRES_DB:-gatemate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
